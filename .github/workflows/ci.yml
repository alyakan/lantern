name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Runs started by someone in CI_RUNNER_USERS (e.g. ["alyakan"]) go to CI_RUNNER (e.g. ["self-hosted","lantern-mac"]),
# that person's own Mac, which keeps its build caches between runs; everything else stays GitHub-hosted. A pull request
# from a fork never does, whoever opened it: the repo is public, and that Mac is someone's own computer. Both variables
# must be valid JSON: a typo fails every run of this workflow before any job starts.
jobs:
  test:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON(vars.CI_RUNNER_USERS || '[]'), github.actor) && fromJSON(vars.CI_RUNNER || '"macos-latest"') || 'macos-latest' }}
    env:
      # A self-hosted runner's background service sets no locale.
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.environment == 'github-hosted'
        with:
          workspaces: src-tauri

      # On a self-hosted Mac, checkout wipes everything untracked in the repo, the target folder too, so every run would
      # compile from scratch: the target lives beside the checkout instead, and kept between runs. Without incremental
      # builds (as rust-cache sets on GitHub), it doesn't grow by GBs a run on a disk that is also someone's own.
      - name: Keep the target folder between runs
        if: runner.environment == 'self-hosted'
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_WORKSPACE/../cargo-target" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"

      - run: npm ci

      - run: npm test

      # Type-checks and builds dist/, which the Rust crate embeds and needs in order to compile.
      - run: npm run build

      - run: cargo test --manifest-path src-tauri/Cargo.toml

      # The phone app's protocol types are generated from the Rust ones (the test above writes them): a change to either
      # that wasn't regenerated and committed fails here, a new type's file included.
      - name: Phone protocol types match the Rust ones
        run: |
          git status --porcelain -- mobile/src/protocol/generated
          test -z "$(git status --porcelain -- mobile/src/protocol/generated)"

      # Clean today; a new warning in the crate fails the check.
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # The phone app's real client (Noise, WebSocket, connection, sync) against the real gateway, which the example runs
      # behind three scripted chats: pairing, following, answering, reconnecting, nothing recorded or faked.
      - run: cargo build --manifest-path src-tauri/Cargo.toml --example fixture_gateway
      - run: npm ci
        working-directory: mobile
      - name: Phone app against the real gateway
        run: LANTERN_FIXTURE_GATEWAY="${CARGO_TARGET_DIR:-$GITHUB_WORKSPACE/src-tauri/target}/debug/examples/fixture_gateway" npm test
        working-directory: mobile

  # The phone app (mobile/): its tests (Noise against the Mac's transcripts and the published vectors, the sync, the
  # connection) and its types.
  mobile:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON(vars.CI_RUNNER_USERS || '[]'), github.actor) && fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      - run: npm test

      - run: npm run typecheck
