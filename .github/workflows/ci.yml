name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm test

      # Type-checks and builds dist/, which the Rust crate embeds and needs in order to compile.
      - run: npm run build

      - run: cargo test --manifest-path src-tauri/Cargo.toml

      # The phone app's protocol types are generated from the Rust ones (the test above writes them): a change to either
      # that wasn't regenerated and committed fails here, a new type's file included.
      - name: Phone protocol types match the Rust ones
        run: |
          git status --porcelain -- mobile/src/protocol/generated
          test -z "$(git status --porcelain -- mobile/src/protocol/generated)"

      # Clean today; a new warning in the crate fails the check.
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  # The phone app (mobile/): its tests (Noise against the Mac's transcripts and the published vectors, the sync, the
  # connection) and its types.
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      - run: npm test

      - run: npm run typecheck
