name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Runs started by someone in CI_RUNNER_USERS (e.g. ["alyakan"]) go to CI_RUNNER (e.g. ["self-hosted","lantern-mac"]),
# that person's own Mac, which keeps its build caches between runs; everything else stays GitHub-hosted. A pull request
# from a fork never does, whoever opened it: the repo is public, and that Mac is someone's own computer. Both variables
# must be valid JSON: a typo fails every run of this workflow before any job starts.
#
# `pick` asks when the run starts whether that Mac is online and idle (.github/pick-runner.sh, with the repo secret
# RUNNER_STATUS_TOKEN): if not, `test` goes to GitHub's runner instead of waiting for it. Another run can take the Mac
# between that answer and the job starting; the job then waits its turn. Without the secret the Mac is always used. The
# phone job is about a minute of work and always runs on GitHub's runner, so it never holds the Mac.
jobs:
  pick:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      USE_MAC: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && contains(fromJSON(vars.CI_RUNNER_USERS || '[]'), github.actor) }}
    outputs:
      mac: ${{ steps.pick.outputs.mac || 'false' }}
    steps:
      # Only for a run that could use the Mac at all: a pull request from a fork gets neither the checkout nor the token.
      - if: env.USE_MAC == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github

      - id: pick
        if: env.USE_MAC == 'true'
        env:
          RUNNER_LABELS: ${{ vars.CI_RUNNER }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
        run: bash .github/pick-runner.sh

  test:
    needs: pick
    runs-on: ${{ needs.pick.outputs.mac == 'true' && fromJSON(vars.CI_RUNNER || '"macos-latest"') || 'macos-latest' }}
    env:
      # A self-hosted runner's background service sets no locale.
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: runner.environment == 'github-hosted'
        with:
          workspaces: src-tauri

      # On a self-hosted Mac, checkout wipes everything untracked in the repo, the target folder too, so every run would
      # compile from scratch: the target lives beside the checkout instead, and kept between runs. Without incremental
      # builds (as rust-cache sets on GitHub), it doesn't grow by GBs a run on a disk that is also someone's own; the
      # last step removes what the run replaced (see .github/prune-target.mjs).
      - name: Keep the target folder between runs
        if: runner.environment == 'self-hosted'
        run: |
          export CARGO_TARGET_DIR="$RUNNER_WORKSPACE/../cargo-target"
          echo "CARGO_TARGET_DIR=$CARGO_TARGET_DIR" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          node .github/prune-target.mjs start

      - run: npm ci

      - run: npm test

      # Type-checks and builds dist/, which the Rust crate embeds and needs in order to compile.
      - run: npm run build

      - run: cargo test --manifest-path src-tauri/Cargo.toml

      # The phone app's protocol types are generated from the Rust ones (the test above writes them): a change to either
      # that wasn't regenerated and committed fails here, a new type's file included.
      - name: Phone protocol types match the Rust ones
        run: |
          git status --porcelain -- mobile/src/protocol/generated
          test -z "$(git status --porcelain -- mobile/src/protocol/generated)"

      # Clean today; a new warning in the crate fails the check.
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # The phone app's real client (Noise, WebSocket, connection, sync) against the real gateway, which the example runs
      # behind three scripted chats: pairing, following, answering, reconnecting, nothing recorded or faked.
      - run: cargo build --manifest-path src-tauri/Cargo.toml --example fixture_gateway
      - run: npm ci
        working-directory: mobile
      - name: Phone app against the real gateway
        run: LANTERN_FIXTURE_GATEWAY="${CARGO_TARGET_DIR:-$GITHUB_WORKSPACE/src-tauri/target}/debug/examples/fixture_gateway" npm test
        working-directory: mobile

      # The kept target folder loses the builds this run replaced, failed run or not.
      - name: Clean the target folder
        if: always() && runner.environment == 'self-hosted' && env.CARGO_TARGET_DIR != ''
        run: node .github/prune-target.mjs end

  # The phone app (mobile/): its tests (Noise against the Mac's transcripts and the published vectors, the sync, the
  # connection) and its types.
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      - run: npm test

      - run: npm run typecheck
