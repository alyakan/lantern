name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Two jobs. `build` compiles the app, with no secrets: a tag pushed by someone in CI_RUNNER_USERS compiles on CI_RUNNER, that
# person's own Mac (as CI does, see ci.yml), anyone else's on GitHub's. `release` always runs on GitHub's Mac, the only place
# the signing secrets reach: it signs the compiled app, makes the dmg and the self-update, the draft, and notarizes. On the
# maintainer's Mac, codesign failed with errSecInternalComponent for a reason not found (#356 didn't cure it), and keeping
# the secrets off a machine that also runs CI is better anyway.
#
# `pick` asks when the tag is pushed whether that Mac is online and idle (.github/pick-runner.sh, with the repo secret
# RUNNER_STATUS_TOKEN): if not, `build` goes to GitHub's runner instead of waiting for it. Another run can take the Mac
# between that answer and the job starting; the job then waits its turn. Without the secret the Mac is always used. On
# the Mac nothing is uploaded to or restored from the Actions cache (its upload took about 20 of a release's 30 minutes):
# the Mac keeps its own build folder and npm cache between runs.
jobs:
  pick:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      USE_MAC: ${{ contains(fromJSON(vars.CI_RUNNER_USERS || '[]'), github.actor) }}
    outputs:
      mac: ${{ steps.pick.outputs.mac || 'false' }}
    steps:
      # Only for a tag pushed by someone who may use the Mac at all.
      - if: env.USE_MAC == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github

      - id: pick
        if: env.USE_MAC == 'true'
        env:
          RUNNER_LABELS: ${{ vars.CI_RUNNER }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
        run: bash .github/pick-runner.sh

  build:
    needs: pick
    runs-on: ${{ needs.pick.outputs.mac == 'true' && fromJSON(vars.CI_RUNNER || '"macos-latest"') || 'macos-latest' }}
    env:
      # A self-hosted runner's background service sets no locale.
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}

      - name: Tag matches the app version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Every file that carries the version has to agree with the tag, or the build ships under the wrong number.
          version=${TAG#v}
          mismatches=()
          check() {
            if [ "$2" != "$version" ]; then
              mismatches+=("$1 says $2")
            fi
          }
          check src-tauri/tauri.conf.json "$(node -p "require('./src-tauri/tauri.conf.json').version")"
          check package.json "$(node -p "require('./package.json').version")"
          check src-tauri/Cargo.toml "$(awk '/^\[package\]/{p = 1; next} /^\[/{p = 0} p && /^version = /{gsub(/"/, ""); print $3; exit}' src-tauri/Cargo.toml)"
          check src-tauri/Cargo.lock "$(awk '/^name = "lantern"$/{getline; gsub(/"/, ""); print $3; exit}' src-tauri/Cargo.lock)"
          if [ ${#mismatches[@]} -gt 0 ]; then
            for m in "${mismatches[@]}"; do
              echo "::error::$m; the tag $TAG needs version $version"
            done
            exit 1
          fi

      # Apple Silicon only (from 0.1.32): one build instead of a universal one's two. Intel Macs stay on 0.1.31, the last
      # universal release; the updater's manifest only lists darwin-aarch64 from here on.
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: runner.environment == 'github-hosted'
        with:
          workspaces: src-tauri

      # On a self-hosted Mac, checkout wipes everything untracked in the repo, the target folder too, so every release would
      # compile from scratch: the target lives beside the checkout instead, and is kept between runs (a folder of its own,
      # apart from CI's debug one, so it can be deleted when the disk is short). Without incremental builds, as in ci.yml.
      - name: Keep the target folder between runs
        if: runner.environment == 'self-hosted'
        run: |
          export CARGO_TARGET_DIR="$RUNNER_WORKSPACE/../cargo-target-release"
          echo "CARGO_TARGET_DIR=$CARGO_TARGET_DIR" >> "$GITHUB_ENV"
          echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
          node .github/prune-target.mjs start || echo "::warning::Couldn't check the target folder"

      - run: npm ci

      # The frontend is built into the binary, so the binary is all `release` needs.
      - name: Compile
        run: npm run tauri build -- --target aarch64-apple-darwin --no-bundle

      # Wherever the target folder is, the binary goes to one fixed place to be uploaded from.
      - name: Collect the binary
        run: |
          mkdir -p compiled
          cp "${CARGO_TARGET_DIR:-src-tauri/target}/aarch64-apple-darwin/release/lantern" compiled/lantern

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lantern-binary
          path: compiled/lantern
          if-no-files-found: error
          retention-days: 1

      # The kept target folder loses the builds this run replaced, failed run or not (see .github/prune-target.mjs). Never
      # what fails a release.
      - name: Clean the target folder
        if: always() && runner.environment == 'self-hosted' && env.CARGO_TARGET_DIR != ''
        continue-on-error: true
        run: node .github/prune-target.mjs end

  release:
    needs: build
    runs-on: macos-latest
    # The Apple signing secrets live in this environment, which only v* tags can use.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release notes read the history back to the previous tag.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # tauri reads the project through cargo metadata; nothing is compiled here.
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - run: npm ci

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lantern-binary
          path: src-tauri/target/aarch64-apple-darwin/release

      # Only the one arm64 binary may come in, nothing else under target/. The artifact's zip drops the executable bit.
      - name: Check the compiled binary
        run: |
          dir=src-tauri/target/aarch64-apple-darwin/release
          [ "$(ls -A "$dir")" = lantern ] || { echo "::error::the artifact holds more than lantern: $(ls -A "$dir")"; exit 1; }
          [ "$(lipo -archs "$dir/lantern")" = arm64 ] || { echo "::error::lantern is not an arm64 Mach-O binary"; exit 1; }
          chmod +x "$dir/lantern"

      # What's new since the previous tag, from the merged PRs, above the install line.
      - name: Write the release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo 'body<<END_OF_NOTES'
            .github/release-notes.sh "$TAG"
            echo 'Download the dmg, open it and drag Lantern to Applications. Requires Claude Code or Codex installed and logged in. From 0.1.1 on, Lantern updates itself.'
            echo 'END_OF_NOTES'
          } >> "$GITHUB_OUTPUT"

      # Signs with the Developer ID certificate. The certificate expires on 1 Feb 2027: after that, export a new one into
      # APPLE_CERTIFICATE. Builds signed before then keep working. It doesn't notarize (no APPLE_API_KEY here): the dmg is
      # notarized once below, and Apple's ticket for it covers the app inside, so a second wait on Apple bought nothing.
      # The `app` bundle also makes the self-update: Lantern.app.tar.gz, signed with the updater key (whose loss would
      # strand every install on its version), and latest.json, which installed apps read once the release is published.
      # tauriScript turns the action's `tauri build` into `tauri bundle`, on the binary the build job compiled.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bash .github/tauri-bundle.sh
          tagName: ${{ github.ref_name }}
          releaseName: Lantern ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          args: --target aarch64-apple-darwin --bundles app,dmg

      # notarytool wants the App Store Connect key as a file: written only now, so it isn't on disk while the build runs.
      - name: Write the notarization key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      # The one notarization: the dmg, with the app in it. Gatekeeper checks the dmg after a download (the ticket is stapled
      # to it) and the app when it first opens (Apple's ticket lists the app's signature too, so that check passes online;
      # the self-update's app is the same app, signed the same). The last check fails the release if Apple doesn't know
      # the app by itself, so a missing ticket can't ship.
      - name: Notarize and staple the dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TAG: ${{ github.ref_name }}
        run: |
          dmg=$(ls src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          app=$(ls -d src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app)
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$dmg"
          spctl -a -vv -t open --context context:primary-signature "$dmg"
          spctl -a -vv -t exec "$app" 2>&1 | tee "$RUNNER_TEMP/app-assessment.txt"
          grep -q "source=Notarized Developer ID" "$RUNNER_TEMP/app-assessment.txt"
          gh release upload "$TAG" "$dmg" --clobber

      - name: Remove the notarization key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
