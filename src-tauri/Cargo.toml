[package]
name = "lantern"
version = "0.1.68"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lantern_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon + image-png: the menu bar item and its icons. macos-private-api: the menu bar panel's transparent window (it draws its
# own rounded corners and shadow); Lantern is not on the App Store, which is the only place that API is a problem.
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tokio = { version = "1.53.1", features = ["process", "io-util", "net", "sync", "time", "macros", "rt-multi-thread"] }
libc = "0.2.189"
ignore = "0.4.33"
tauri-plugin-notification = "2"
similar = "2"
regex = "1"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
snow = "0.9"
base64 = "0.22"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
ts-rs = "10"
security-framework = "3"
getrandom = "0.3"
if-addrs = "0.13"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake", "connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "http2"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
# The menu's accelerators are checked with the parser the menu itself uses (tauri's own copy of it).
muda = "0.20"
# The gateway's handshake timeout is tested on a paused clock.
tokio = { version = "1.53.1", features = ["test-util"] }
