<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6efe2"/>
      <stop offset="1" stop-color="#e6d9c2"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ff9a2a"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- handle -->
  <path d="M442 290 a70 70 0 0 1 140 0" fill="none" stroke="#2b2f3a" stroke-width="28" stroke-linecap="round"/>
  <!-- light behind the pages -->
  <rect x="352" y="330" width="320" height="420" rx="40" fill="url(#light)"/>
  <!-- three stacked pages, offset so light shows between them -->
  <rect x="332" y="330" width="300" height="120" rx="26" fill="#2b2f3a"/>
  <rect x="392" y="480" width="300" height="120" rx="26" fill="#2b2f3a"/>
  <rect x="332" y="630" width="300" height="120" rx="26" fill="#2b2f3a"/>
  <!-- page lines -->
  <g stroke="#efe3cc" stroke-width="14" stroke-linecap="round" opacity="0.8">
    <line x1="372" y1="375" x2="560" y2="375"/><line x1="372" y1="405" x2="500" y2="405"/>
    <line x1="432" y1="525" x2="620" y2="525"/><line x1="432" y1="555" x2="560" y2="555"/>
    <line x1="372" y1="675" x2="560" y2="675"/><line x1="372" y1="705" x2="500" y2="705"/>
  </g>
</svg>
